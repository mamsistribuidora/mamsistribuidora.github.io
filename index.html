<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel MAM | Matias Arsénio Manuel</title>
    <style>
        /* MANTENDO O FUNDO PRETO ORIGINAL DA IMAGEM */
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
        }

        /* MENU LATERAL (SIDEBAR) - CONFORME ORIENTAÇÃO */
        .sidebar {
            width: 250px;
            background: #0a0a0a;
            height: 100vh;
            position: fixed;
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        /* IDENTIDADE NO TOPO DO MENU */
        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid #1a1a1a;
        }
        .distribuidora-nome { color: #FFD700; font-size: 18px; font-weight: bold; display: block; }
        .utilizador-nome { color: #888; font-size: 11px; text-transform: uppercase; }

        /* LINKS DO MENU */
        .nav-link {
            padding: 15px 20px;
            text-decoration: none;
            color: #ccc;
            font-size: 14px;
            border-bottom: 1px solid #111;
        }
        .nav-link:hover, .nav-link.active { color: #FFD700; background: #111; }

        /* BOTÃO TERMINAR SESSÃO NO LOCAL DE SEMPRE (FINAL DO MENU) */
        .logout-link { margin-top: auto; color: #ff4d4d !important; border-top: 1px solid #1a1a1a; }

        /* CONTEÚDO PRINCIPAL (MANTENDO O QUE ESTÁ NA IMAGEM) */
        .main-content { margin-left: 250px; padding: 20px; flex: 1; }

        /* APOIA ESTE PROJETO (RETIFICADO) */
        .card-apoio {
            background: #111;
            border-left: 4px solid #FFD700;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .iban-txt { color: #FFD700; font-size: 16px; font-weight: bold; margin-top: 5px; }

        /* SEÇÕES DA IMAGEM (MANTIDAS) */
        .secao-titulo { margin: 25px 0 15px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .grid-musicas { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .capa { background: #1a1a1a; aspect-ratio: 1/1; border-radius: 8px; }

        /* CARD CONVITE */
        .card-convite {
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
        }
        .btn-gold { background: #FFD700; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* RODAPÉ (ADICIONADO) */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #444;
            font-size: 11px;
            margin-top: 40px;
            border-top: 1px solid #111;
        }

        /* AJUSTE PARA TELEMÓVEL */
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; }
            .main-content { margin-left: 0; }
            .logout-link { margin-top: 0; }
        }
    </style>
</head>
<body>

        </div>
