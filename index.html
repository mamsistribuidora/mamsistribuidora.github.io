<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora - Oficial</title>
    <style>
        :root {
            --mam-gold: #d4af37;
            --mam-black: #000000;
            --mam-dark-grey: #1a1a1a;
            --mam-input: #121212;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--mam-black); 
            color: white; 
            display: flex; 
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- PAINEL DE ACESSO (CONFORME IMAGEM) --- */
        #auth-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            border: 2px solid var(--mam-gold);
            border-radius: 30px;
            padding: 40px 25px;
            text-align: center;
            background: var(--mam-black);
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            border: 2px solid var(--mam-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--mam-gold);
        }

        .auth-card h1 {
            color: var(--mam-gold);
            font-size: 1.5rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .auth-card p {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 30px;
        }

        .input-group { margin-bottom: 15px; }

        input, select {
            width: 100%;
            background: var(--mam-input);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: var(--mam-gold); }

        .btn-entrar {
            width: 100%;
            background: var(--mam-gold);
            color: black;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
        }

        .auth-toggle {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
            cursor: pointer;
        }
        .auth-toggle span { color: var(--mam-gold); text-decoration: underline; }

        /* --- INTERFACE LOGADA --- */
        #main-site { display: none; }

        nav {
            background: var(--mam-dark-grey);
            padding: 15px;
            border-bottom: 1px solid var(--mam-gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo { margin-bottom: 10px; }
        .nav-logo h2 { color: var(--mam-gold); font-size: 1.2rem; }
        .nav-logo small { font-size: 0.7rem; color: #fff; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .menu-btn {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 5px;
        }

        .section { padding: 20px; max-width: 1000px; margin: auto; }
        .card { background: #111; border: 1px solid #222; padding: 20px; border-radius: 15px; margin-bottom: 20px; }

        /* Estilo Disco (Lançamentos) */
        .vinyl-container { text-align: center; margin-top: 20px; }
        .vinyl {
            width: 150px; height: 150px;
            background: radial-gradient(circle, #333 10%, #000 70%);
            border-radius: 50%;
            border: 4px solid #1a1a1a;
            margin: 0 auto 10px;
            animation: spin 5s linear infinite;
        }
        @keyframes spin { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }

        footer {
            background: var(--mam-dark-grey);
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            border-top: 1px solid var(--mam-gold);
            margin-top: auto;
        }
