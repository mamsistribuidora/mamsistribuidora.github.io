<!DOCTYPE html>
<html lang="pt-pt">

    <style>
        :root { --gold: #D4AF37; --black: #000; --dark: #0a0a0a; --grey: #1a1a1a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--black); color: #fff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        header { background: #000; padding: 15px; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 5000; }
        .logo { color: var(--gold); font-weight: bold; text-transform: uppercase; font-size: 14px; }
        .ceo-label { color: #888; font-size: 10px; display: block; }

        .layout { display: flex; flex: 1; }
        
        /* Menu Lateral Fixo */
        nav { width: 220px; background: #050505; border-right: 1px solid var(--grey); padding: 10px; position: fixed; height: 100%; z-index: 4000; }
        .nav-item { padding: 14px; color: #888; cursor: pointer; display: block; font-size: 12px; margin-bottom: 5px; border-radius: 6px; border: none; background: transparent; width: 100%; text-align: left; transition: 0.2s; }
        .nav-item.active { background: #111; color: var(--gold); font-weight: bold; border-left: 4px solid var(--gold); }

        /* Área de Conteúdo que muda conforme o clique */
        main { flex: 1; margin-left: 220px; padding: 20px; padding-bottom: 120px; min-height: 100vh; }
        .secao { display: none; } /* Escondido por padrão */
        .secao.ativa { display: block !important; } /* Só mostra a ativa */

        .box { background: var(--dark); border: 1px solid var(--grey); padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .btn-acao { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 11px; text-transform: uppercase; }
        
        input, textarea, select { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; }
        label { font-size: 11px; color: var(--gold); font-weight: bold; display: block; margin-top: 10px; }

        .feed-container { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; }
        .disco { min-width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--gold); text-align: center; }

        footer { text-align: center; padding: 15px; font-size: 10px; color: var(--gold); background: #000; border-top: 1px solid #111; position: fixed; bottom: 0; width: 100%; z-index: 5000; }

        @media (max-width: 768px) { nav { width: 85px; } .nav-item { font-size: 9px; text-align: center; padding: 12px 2px; } main { margin-left: 85px; } }
    </style>
</head>
