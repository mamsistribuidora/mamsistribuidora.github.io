        body {

            background-size: cover; color: #fff; min-height: 100vh;

        #authArea { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); }
        .auth-card { background: var(--card); padding: 40px; border-radius: 20px; border: 2px solid var(--gold); width: 90%; max-width: 420px; text-align: center; backdrop-filter: blur(10px); }
        .logo-main { font-weight: 900; color: var(--gold); font-size: 1.8rem; text-transform: uppercase; }

        .btn-gold { width: 100%; padding: 16px; background: var(--gold); color: #000; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        #mainPanel { display: none; background: rgba(0,0,0,0.7); min-height: 100vh; }
        header { background: #000; padding: 15px 25px; border-bottom: 1px solid var(--gold); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }

        .nav-item { padding: 14px 18px; color: #aaa; cursor: pointer; border-radius: 10px; font-size: 14px; font-weight: 600; transition: 0.3s; }
        .nav-item:hover { background: rgba(212, 175, 55, 0.1); color: var(--gold); }
        .nav-item.logout { color: #ff4444; margin-top: auto; border-top: 1px solid #222; padding-top: 20px; }

        main { flex: 1; padding: 30px; overflow-y: auto; height: calc(100vh - 75px); padding-bottom: 100px; }

        .profile-card { background: #111; padding: 25px; border-radius: 20px; border: 1px solid var(--gold); margin-bottom: 30px; text-align: center; }
        .profile-pic-box { position: relative; width: 100px; height: 100px; margin: 0 auto 15px; }
        #profilePic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
        .edit-icon { position: absolute; bottom: 0; right: 0; background: var(--gold); color: #000; width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
        .balance-display { font-size: 2rem; font-weight: 900; color: var(--gold); margin: 10px 0; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 5px; font-size: 10px; font-weight: 900; margin-bottom: 15px; }
