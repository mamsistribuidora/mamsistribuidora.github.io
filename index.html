<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Oficial</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #D4AF37; --bg: #0a0a0a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: var(--bg) url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=1200&q=80') no-repeat center center fixed; 
            background-size: cover; color: #fff; min-height: 100vh;
        }

        header { background: #000; padding: 15px 25px; border-bottom: 1px solid var(--gold); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .logo-main { font-weight: 900; color: var(--gold); font-size: 1.1rem; text-transform: uppercase; }
        .logo-sub { font-size: 0.5rem; color: #fff; }

        .layout { display: flex; min-height: calc(100vh - 75px); }
        
        /* MENU LATERAL */
        nav { width: 250px; background: rgba(0,0,0,0.9); border-right: 1px solid #222; padding: 25px; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { padding: 14px 18px; color: #aaa; cursor: pointer; border-radius: 10px; font-size: 14px; font-weight: 600; }
        .nav-item:hover, .nav-item.active { background: rgba(212, 175, 55, 0.1); color: var(--gold); }

        main { flex: 1; padding: 30px; overflow-y: auto; }
        
        .secao { display: none; }
        .secao.ativa { display: block; }

        /* PÁGINA INICIAL */
        .promo-banner { border: 2px dashed var(--gold); padding: 20px; border-radius: 15px; background: rgba(0,0,0,0.5); margin-bottom: 30px; }
        .disco-grid { display: flex; gap: 20px; }
        .vinyl { width: 120px; height: 120px; border-radius: 50%; background: #111; border: 4px solid #222; }
        
        .reward-card { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #222; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .btn-gold { background: var(--gold); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 900; cursor: pointer; }

        /* PERFIL EDITÁVEL */
        .perfil-box { max-width: 450px; margin: 0 auto; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 20px; border: 1px solid var(--gold); text-align: center; }
        .p-img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--gold); margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; }

        footer { position: fixed; bottom: 0; width: 100%; padding: 15px; background: #000; border-top: 1px solid var(--gold); text-align: center; color: var(--gold); font-size: 10px; font-weight: 900; }
    </style>
</head>
<body>

<header>
    <div>
        <div class="logo-main">MAM Distribuidora</div>
        <div class="logo-sub">Matias Arsénio Manuel</div>
    </div>
    <div id="userMail" style="font-size: 10px; color: var(--gold);"></div>
</header>

<div class="layout">
