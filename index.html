<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Oficial</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --gold: #D4AF37; --black: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--black); color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #000; padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        
        .layout { display: flex; flex: 1; overflow: hidden; }
        
        nav { width: 100px; background: #050505; border-right: 1px solid #222; display: flex; flex-direction: column; padding-top: 10px; }
        .nav-item { padding: 15px 5px; color: #777; cursor: pointer; border: none; background: transparent; font-size: 10px; text-align: center; text-transform: uppercase; }
        .nav-item.active { color: var(--gold); font-weight: bold; border-left: 3px solid var(--gold); background: #111; }

        main { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
        .secao { display: none; }
        .secao.ativa { display: block !important; }

        .card { background: #0f0f0f; border: 1px solid #222; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .btn-gold { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; }
        footer { background: #000; color: var(--gold); text-align: center; padding: 10px; font-size: 9px; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #222; }
    </style>
</head>
<body>

<header>
    <div style="color:var(--gold); font-weight:bold; font-size:14px;">MAM DISTRIBUIDORA</div>
    <div id="userTag" style="font-size:9px; color:var(--gold)">...</div>
</header>

<div class="layout">
    <nav>
        <div class="nav-item active" onclick="ver('home', this)">Início</div>
        <div class="nav-item" onclick="ver('lancar', this)">Lançar</div>
        <div class="nav-item" onclick="ver('carteira', this)">Carteira</div>
        <div class="nav-item" onclick="ver('stats', this)">Stats</div>
        <div class="nav-item" style="color:red; margin-top:auto; padding-bottom:30px;" onclick="fazerSair()">SAIR</div>
    </nav>

    <main>
        <div id="home" class="secao ativa">
            <div class="card" style="border: 1px dashed var(--gold);">
                <h4 style="color:var(--gold)">APOIO AO CEO</h4>
                <p style="font-size: 11px; margin-top:5px;">IBAN BFA: 0006.0000.8631.6866.3015.2</p>
            </div>
            <h3>Lançamentos</h3>
            <div style="display:flex; gap:10px; padding:15px 0;">
                <div style="width:70px; height:70px; border-radius:50%; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:8px; text-align:center;">PLAY SEAN</div>
            </div>
        </div>

        <div id="lancar" class="secao">
            <div class="card">
                <h3>Enviar Obra</h3>
                <input type="text" id="mTitulo" placeholder="Título da Música">
                <input type="file" id="fMp3" style="display:none;" multiple>
                <button class="btn-gold" onclick="document.getElementById('fMp3').click()">ANEXAR MÚSICA + CAPA</button>
                <button class="btn-gold" style="background:#fff; margin-top:20px;" onclick="alert('Enviando para o CEO...')">FINALIZAR LANÇAMENTO</button>
            </div>
        </div>

        <div id="carteira" class="secao">
            <div class="card" style="text-align:center">
                <p style="font-size:10px; color:#777">SALDO ATUAL</p>
                <h1 id="usrSaldo" style="color:var(--gold); font-size:40px; margin:10px 0;">0,00 Kz</h1>
                <input type="text" id="sIban" placeholder="Introduza o IBAN de destino">
                <button class="btn-gold" onclick="alert('Solicitação de Saque Enviada!')">SOLICITAR PAGAMENTO</button>
            </div>
        </div>

        <div id="stats" class="secao">
            <div class="card">
                <h3>Estatísticas Reais</h3>
                <div style="display:flex; justify-content:space-around; margin-top:20px;">
                    <div><p>Ouvintes</p><h2 style="color:var(--gold)">0</h2></div>
                    <div><p>Músicas</p><h2 style="color:var(--gold)">0</h2></div>
                </div>
            </div>
        </div>
    </main>
</div>

<footer>MAM DISTRIBUIDORA DIGITAL | CEO Matias Arsénio Manuel</footer>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBBsZS8EpszUtikaKS8B5te8C7Q9Ow-9wo", authDomain: "mam-distribuidora.firebaseapp.com", projectId: "mam-distribuidora", storageBucket: "mam-distribuidora.appspot.com", messagingSenderId: "670857002452", appId: "1:670857002452:web:404822b5376075e520ea41" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.firestore();

    // NAVEGAÇÃO QUE ISOLA AS TELAS
    function ver(id, btn) {
        document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
        document.getElementById(id).classList.add('ativa');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        btn.classList.add('active');
    }

    // BOTÃO SAIR QUE REALMENTE FUNCIONA
    function fazerSair() {
        if(confirm("Deseja mesmo sair da conta MAM?")) {
            auth.signOut().then(() => {
                window.location.href = "index.html";
            }).catch(err => {
                alert("Erro ao sair. Recarregue a página.");
            });
        }
    }

    auth.onAuthStateChanged(u => {
        if(u) {
            document.getElementById('userTag').innerText = u.email.split('@')[0];
            db.collection("users").doc(u.uid).onSnapshot(doc => {
                if(doc.exists) document.getElementById('usrSaldo').innerText = (doc.data().saldo || 0).toLocaleString() + ",00 Kz";
            });
        }
    });
</script>
</body>
</html>
