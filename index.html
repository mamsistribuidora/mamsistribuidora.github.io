<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Oficial</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #D4AF37; --bg: #0d0d0d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #000 url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=1200&q=80') no-repeat center center fixed; 
            background-size: cover; color: #fff; min-height: 100vh; overflow-x: hidden;
        }

        /* HEADER ORIGINAL */
        header { 
            background: rgba(0,0,0,0.95); padding: 12px 25px; border-bottom: 1px solid #222;
            display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000;
        }
        .logo-box { line-height: 1.1; }
        .logo-txt { color: var(--gold); font-weight: 900; font-size: 15px; text-transform: uppercase; }
        .logo-sub { font-size: 8px; color: #fff; letter-spacing: 1px; }
        .search-container { flex: 1; max-width: 500px; margin: 0 40px; }
        .search-container input { width: 100%; background: #111; border: 1px solid #333; padding: 7px 15px; border-radius: 5px; color: #fff; outline: none; font-size: 12px; }

        .layout { display: flex; min-height: calc(100vh - 65px); }

        /* MENU LATERAL - 8 OPÇÕES */
        nav { width: 240px; background: rgba(0,0,0,0.9); border-right: 1px solid #222; padding: 25px 15px; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { padding: 12px 18px; color: #aaa; cursor: pointer; border-radius: 8px; font-size: 13px; font-weight: 600; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(212, 175, 55, 0.1); color: var(--gold); }
        .nav-item.exit { color: #ff4444; margin-top: auto; border-top: 1px solid #222; padding-top: 20px; }

        main { flex: 1; padding: 30px; background: rgba(0,0,0,0.5); }

        /* SECCIONALIZAÇÃO */
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* PÁGINA INICIAL APROVADA */
        .apoio-banner { border: 1px dashed var(--gold); padding: 20px; border-radius: 5px; margin-bottom: 35px; background: rgba(0,0,0,0.4); }
        .apoio-banner h2 { color: var(--gold); font-size: 14px; margin-bottom: 5px; }
        .apoio-banner p { font-size: 11px; }

        .feed-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
        .disco-list { display: flex; gap: 25px; margin-bottom: 45px; flex-wrap: wrap; }
        .disco-item { text-align: center; width: 130px; }
