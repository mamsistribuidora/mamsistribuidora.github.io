<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Login</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { border: 2px solid #FFD700; border-radius: 20px; padding: 30px; width: 330px; text-align: center; background: #000; }
        .logo-circulo { width: 80px; height: 80px; border: 3px solid #FFD700; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 15px; font-weight: bold; color: #FFD700; font-size: 20px; }
        h1 { color: #FFD700; font-size: 20px; margin: 0 0 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #111; border: 1px solid #333; border-radius: 10px; color: #fff; box-sizing: border-box; }
        .btn-gold { width: 100%; padding: 14px; background: #FFD700; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .btn-link { background: none; border: 1px solid #FFD700; color: #FFD700; width: 100%; padding: 10px; border-radius: 10px; margin-top: 15px; cursor: pointer; }
        footer { margin-top: 20px; font-size: 10px; color: #444; }
    </style>
</head>
<body>
    <div class="container" id="login-box">
        <div class="logo-circulo">MAM</div>
        <h1>MAM Distribuidora</h1>
        <p style="font-size: 11px; color: #888;">INICIAR SESSÃO</p>
        <form onsubmit="event.preventDefault(); window.location.href='painel.html';">
            <input type="email" placeholder="E-mail" required>
            <input type="password" placeholder="Senha" required>
            <button type="submit" class="btn-gold">ENTRAR</button>
        </form>
        <div style="margin: 15px 0; color: #222;">OU</div>
        <button class="btn-link" onclick="toggleAuth()">CRIAR CONTA</button>
        <footer>© 2026 MAM Distribuidora | Matias Arsénio Manuel</footer>
    </div>

    <div class="container" id="reg-box" style="display: none;">
        <h1>CRIAR CONTA</h1>
        <form onsubmit="finalizarReg(event)">
            <input type="text" placeholder="Nome Completo" required>
            <input type="text" placeholder="Nome Artístico" required>
            <input type="email" placeholder="E-mail" required>
            <input type="text" placeholder="País" required>
            <input type="password" id="s1" placeholder="Senha" required>
            <input type="password" id="s2" placeholder="Confirmar Senha" required>
            <button type="submit" class="btn-gold">FINALIZAR REGISTO</button>
        </form>
        <button class="btn-link" onclick="toggleAuth()">VOLTAR AO LOGIN</button>
    </div>

    <script>
        function toggleAuth() {
            const l = document.getElementById('login-box');
            const r = document.getElementById('reg-box');
            l.style.display = l.style.display==='none'?'block':'none';
            r.style.display = r.style.display==='none'?'block':'none';
        }
        function finalizarReg(e) {
            e.preventDefault();
            if(document.getElementById('s1').value !== document.getElementById('s2').value) return alert("Senhas diferentes!");
            alert("Bónus Satélite: Recebeste 2.000 KZ! MAM recebeu 5.000 KZ.");
            window.location.href = 'painel.html';
        }
    </script>
</body>
</html>
