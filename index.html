<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Oficial</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --gold: #D4AF37; --black: #000; --dark: #0a0a0a; --grey: #1a1a1a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--black); color: #fff; min-height: 100vh; }

        header { background: #000; padding: 15px; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 3000; }
        .logo { color: var(--gold); font-weight: bold; text-transform: uppercase; font-size: 14px; }
        .ceo-label { color: #666; font-size: 10px; display: block; margin-top: 2px; }

        .layout { display: flex; min-height: calc(100vh - 70px); }
        
        nav { width: 200px; background: #050505; border-right: 1px solid var(--grey); padding: 15px; position: fixed; height: 100%; }
        .nav-item { padding: 12px; color: #888; cursor: pointer; display: block; font-size: 13px; margin-bottom: 5px; border-radius: 4px; text-decoration: none; }
        .nav-item.active { background: #111; color: var(--gold); font-weight: bold; border-left: 3px solid var(--gold); }

        main { flex: 1; margin-left: 200px; padding: 20px; padding-bottom: 100px; }
        
        .secao { display: none; }
        .secao.ativa { display: block !important; }

        .box { background: var(--dark); border: 1px solid var(--grey); padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .btn-acao { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 10px; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; }

        .feed-container { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; }
        .disco-capa { min-width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--gold); background: #111; display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--gold); text-align: center; }

        footer { text-align: center; padding: 15px; font-size: 10px; color: var(--gold); background: #000; border-top: 1px solid #111; width: 100%; position: fixed; bottom: 0; z-index: 2000; }

        @media (max-width: 768px) {
            nav { width: 80px; padding: 5px; }
            main { margin-left: 80px; }
            .nav-item { font-size: 8px; text-align: center; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">MAM DISTRIBUIDORA</div>
    <span class="ceo-label">Matias Arsénio Manuel</span>
</header>

        <div class="nav-item" onclick="mudar('lancar', this)">Lançar Música</div>
        <div class="nav-item" onclick="mudar('carteira', this)">Carteira</div>
        <div class="nav-item" onclick="mudar('stats', this)">Estatística</div>
        <div class="nav-item" style="color:red; margin-top:20px;" onclick="auth.signOut().then(()=>location.reload())">Sair</div>
    </nav>

            </div>
            <h4>Lançamentos</h4>
