<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Oficial</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #0b0c10; color: white; text-align: center; }
        header { background: #1f2833; padding: 25px; border-bottom: 3px solid #45a29e; }
        .container { padding: 20px; max-width: 450px; margin: auto; }
        .card { background: #1f2833; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #45a29e; }
        .saldo-label { color: #66fcf1; font-size: 14px; letter-spacing: 2px; }
        .saldo { font-size: 50px; font-weight: bold; color: white; margin: 15px 0; }
        .btn { display: block; width: 100%; padding: 18px; margin: 15px 0; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-play { background: #66fcf1; color: #0b0c10; }
        .btn-saque { background: #45a29e; color: white; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(102, 252, 241, 0.3); }
        input { width: 90%; padding: 12px; background: #0b0c10; border: 1px solid #45a29e; border-radius: 8px; color: white; margin-bottom: 15px; outline: none; }
        .info-parceria { font-size: 11px; color: #45a29e; margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0; color: #66fcf1;">MAM DISTRIBUIDORA</h1>
    <p style="font-size: 12px; margin-top: 5px;">SISTEMA DE GANHOS REAIS - ANGOLA</p>
</header>

<div class="container">
    <div class="card">
        <span class="saldo-label">CARTEIRA DO OUVINTE</span>
        <div class="saldo"><span id="saldo-user">0</span> KZ</div>
        
        <p id="status-saque" style="font-size: 13px; color: #ff4c4c;">Mínimo para saque: 10.000 KZ</p>
        
        <button class="btn btn-play" onclick="ouvirMusica()">
            ▶️ OUVIR MÚSICA NO FEED (+300 KZ)
        </button>
        
        <div style="margin: 25px 0;"></div>
        
        <input type="text" id="iban-field" placeholder="Digite seu IBAN para Receber">
        <button id="btn-saque" class="btn btn-saque" onclick="processarSaque()" disabled>
            SOLICITAR SAQUE AGORA
        </button>

        <div class="info-parceria">
            SISTEMA DE SATÉLITE ATIVO: 1 OUVINTE = +5.000 KZ (ADMIN)
        </div>
    </div>
</div>

<script>
    let saldoOuvinte = 0;
    const MINIMO_SAQUE = 10000;
    const GANHO_POR_MUSICA = 300;

    function ouvirMusica() {
        // O ouvinte ganha 300 KZ por cada música
        saldoOuvinte += GANHO_POR_MUSICA;
        document.getElementById('saldo-user').innerText = saldoOuvinte.toLocaleString();
        
        // Regra de libertação do botão de saque
        const btn = document.getElementById('btn-saque');
        const status = document.getElementById('status-saque');
        
        if (saldoOuvinte >= MINIMO_SAQUE) {
            btn.disabled = false;
            status.innerText = "SAQUE AUTORIZADO!";
            status.style.color = "#66fcf1";
        }
    }

    function processarSaque() {
        const iban = document.getElementById('iban-field').value;
        if (iban.length < 10) {
            alert("ERRO: O IBAN inserido é inválido. Verifique os dados.");
            return;
        }

        alert("PEDIDO DE SAQUE REALIZADO COM SUCESSO!\n\nValor: " + saldoOuvinte + " KZ\nIBAN: " + iban + "\n\nO pagamento será processado em breve pela MAM Distribuidora.");
        
        // Reinicia o saldo após o pedido
        saldoOuvinte = 0;
        document.getElementById('saldo-user').innerText = "0";
        document.getElementById('btn-saque').disabled = true;
        document.getElementById('status-saque').innerText = "Mínimo para saque: 10.000 KZ";
        document.getElementById('status-saque').style.color = "#ff4c4c";
    }
</script>

</body>
</html>
