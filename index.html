<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Oficial</title>
    <style>
        /* CONFIGURAÇÃO GERAL */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }

        h1 { color: #1a1a1a; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }

        /* OS BOTÕES COM EFEITO QUE PEDISTE */
        .btn-whatsapp {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s ease; /* Efeito de suavidade */
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            transform: translateY(-5px) scale(1.05); /* Sobe e aumenta um pouco */
            background-color: #128C7E;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.5);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MAM Distribuidora</h1>
        <p>Distribuidora Musical Angola - Qualidade e Confiança.</p>
        
        <a href="https://wa.me/244900000000" target="_blank" class="btn-whatsapp">
            Falar no WhatsApp
        </a>

        <div class="footer">
            Desenvolvido por Matias Arsénio Manuel
        </div>
    </div>

</body>
</html>
