<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel MAM | Matias Arsénio Manuel</title>
    <style>
        /* DESIGN DARK ORIGINAL */
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* Essencial para mobile */
        }

        /* MENU LATERAL (SIDEBAR) - AJUSTADO */
        .sidebar {
            width: 260px;
            background: #0a0a0a;
            height: 100vh;
            position: fixed;
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: 0.3s;
        }

        /* IDENTIDADE NO MENU */
        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid #1a1a1a;
        }

        .distribuidora-nome {
            color: #FFD700;
            font-size: 18px;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .utilizador-nome {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
        }

        .nav-link {
            padding: 15px 20px;
            text-decoration: none;
            color: #ccc;
            font-size: 14px;
            border-bottom: 1px solid #111;
            transition: 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: #FFD700;
            background: #111;
        }

        /* BOTÃO TERMINAR SESSÃO */
        .logout-link {
            margin-top: auto;
            color: #ff4d4d !important;
            border-top: 1px solid #1a1a1a;
        }

        /* CONTEÚDO PRINCIPAL */
        .main-content {
            margin-left: 260px; /* Espaço da sidebar no desktop */
            padding: 20px;
            flex: 1;
        }

        /* CARD DE APOIO */
        .card-apoio {
            background: #111;
            border-left: 4px solid #FFD700;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .tag-apoio { color: #888; font-size: 11px; text-transform: uppercase; }
        .iban-txt { color: #FFD700; font-size: 16px; font-weight: bold; margin-top: 5px; }

        /* SEÇÕES DE MÚSICA */
        .secao-titulo { margin: 25px 0 15px; font-weight: bold; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .grid-musicas { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .capa { background: #1a1a1a; aspect-ratio: 1/1; border-radius: 8px; width: 100%; }
        .info { margin-top: 8px; font-size: 12px; }
        .info span { color: #666; font-size: 10px; display: block; }

        /* CARD CONVITE */
        .card-convite {
            background: #050505;
            border: 1px solid #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
        }

            padding: 12px; border-radius: 6px; flex: 1; font-size: 11px;
