<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Oficial</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #D4AF37; --bg: #0d0d0d; --nav-bg: #121212; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { background-color: var(--bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; }

        /* HEADER ORIGINAL */
        header { 
            height: 70px; background: #000; border-bottom: 1px solid #222;
            display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
            position: sticky; top: 0; z-index: 1000;
        }
        .search-box { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 8px 15px; width: 400px; display: flex; align-items: center; }
        .search-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; margin-left: 10px; }

        .layout { display: flex; flex: 1; }

        /* MENU COMPLETO - 6 OPÇÕES */
        nav { width: 260px; background: var(--nav-bg); border-right: 1px solid #222; padding: 30px 20px; display: flex; flex-direction: column; gap: 10px; }
        .nav-link { padding: 12px 15px; color: #888; text-decoration: none; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: rgba(212, 175, 55, 0.1); color: var(--gold); }
        .nav-link.exit { color: #ff4444; margin-top: auto; border-top: 1px solid #222; padding-top: 20px; border-radius: 0; }

        main { flex: 1; padding: 30px; overflow-y: auto; height: calc(100vh - 70px); }

        /* SEÇÕES */
        .content-sec { display: none; }
        .content-sec.active { display: block; }

        /* PAGINA INICIAL COMPLETA */
        .apoio-card { border: 1px dashed var(--gold); padding: 20px; border-radius: 10px; background: rgba(212,175,55,0.02); margin-bottom: 30px; }
        .apoio-card h2 { color: var(--gold); font-size: 14px; text-transform: uppercase; margin-bottom: 5px; }
        
        .section-title { font-size: 18px; margin-bottom: 20px; font-weight: 600; color: #eee; }
        
        .feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .disco { text-align: center; }
        .vinyl-art { width: 140px; height: 140px; background: #1a1a1a; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); border: 1px solid #333; position: relative; overflow: hidden; }
        .vinyl-art::after { content: ''; position: absolute; top: 0; right: -50%; width: 100%; height: 100%; background: rgba(255,255,255,0.05); transform: skewX(-20deg); }

        .reward-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .reward-card { background: #151515; padding: 20px; border-radius: 12px; border: 1px solid #222; display: flex; align-items: center; justify-content: space-between; }
        .btn-gold { background: var(--gold); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 900; font-size: 11px; cursor: pointer; }

        /* PERFIL (EDITÁVEL) */
        .profile-box { max-width: 600px; margin: 0 auto; background: #151515; border: 1px solid var(--gold); padding: 40px; border-radius: 20px; text-align: center; }
        .avatar-edit { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--gold); margin: 0 auto 20px; position: relative; background: #000; }
        .avatar-edit img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .edit-icon { position: absolute; bottom: 5px; right: 5px; background: var(--gold); color: #000; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        
        input, textarea { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; outline: none; }
        .status-tag { display: inline-block; padding: 5px 15px; border-radius: 20px; background: #333; font-size: 10px; font-weight: 900; margin: 10px 0; }

        footer { padding: 15px; text-align: center; background: #000; color: var(--gold); font-size: 10px; font-weight: 900; border-top: 1px solid #222; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; color: var(--gold);">MAM DISTRIBUIDORA</div>
    <div class="search-box">
        <span>🔍</span>
        <input type="text" placeholder="Pesquisar músicas, álbuns ou artistas...">
    </div>
    <div id="userDisplay" style="font-size: 11px; font-weight: 600; color: #888;"></div>
</header>

<div class="layout">
    <nav>
        <div class="nav-link active" onclick="tab('home', this)">Página inicial</div>
        <div class="nav-link" onclick="tab('perfil', this)">Perfil</div>
        <div class="nav-link">Minhas Músicas</div>
        <div class="nav-link">Lança Música</div>
        <div class="nav-link">Carteira</div>
        <div class="nav-link exit" onclick="location.reload()">Sair</div>
    </nav>

    <main>
        <div id="home" class="content-sec active">
            <div class="apoio-card">
                <h2>APOIA ESTE PROJECTO</h2>
                <p>IBAN BFA: 0006.0000.8631.6866.3015.2 | MATIAS ARSÉNIO MANUEL</p>
            </div>

            <h3 class="section-title">Feed de Lançamentos
