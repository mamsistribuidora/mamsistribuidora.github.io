<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAM Distribuidora</title>
<link rel="icon" href="https://files.manuscdn.com/user_upload_by_module/session_file/310519663450024747/AtrAfygFawvBQRGl.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root{--gold:#d4af37;--card:rgba(15,15,15,.98);--text:#fff;--gray:#888}
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),url('https://files.manuscdn.com/user_upload_by_module/session_file/310519663450024747/AtrAfygFawvBQRGl.jpg') center/cover fixed;color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:rgba(0,0,0,.98);border-bottom:2px solid var(--gold);padding:15px;position:sticky;top:0;z-index:1000;text-align:center}
.logo img{width:50px;height:50px;border-radius:50%;border:2px solid var(--gold)}
.logo-text{color:var(--gold);font-size:1.4rem;font-weight:bold;letter-spacing:2px}
nav{display:flex;gap:5px;padding:10px;background:#050505;position:sticky;top:82px;z-index:999;flex-wrap:wrap;justify-content:center;border-bottom:1px solid #222}
.nav-btn{background:#111;border:1px solid #333;color:var(--gray);padding:10px 15px;font-size:.75rem;cursor:pointer;border-radius:4px}
.nav-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.1)}
.container{max-width:1200px;margin:0 auto;padding:20px;flex:1}
.section{display:none}.section.active{display:block}
.card{background:var(--card);border:1px solid #222;padding:25px;border-radius:12px;margin-bottom:20px;border-left:4px solid var(--gold)}
.card h3{color:var(--gold);font-size:1.1rem;margin-bottom:20px;text-transform:uppercase}
label{display:block;color:var(--gold);font-size:.8rem;margin-bottom:6px;font-weight:bold;text-transform:uppercase}
input,select,textarea{width:100%;padding:14px;background:#000;border:1px solid #333;color:var(--text);border-radius:8px;margin-bottom:15px}
.btn{width:100%;padding:14px;background:var(--gold);color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-sec{background:#222;color:var(--gold);border:1px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:25px}
#loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center}
.spinner{width:50px;height:50px;border:5px solid #222;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.upload-progress{background:#0a0a0a;border:1px solid var(--gold);border-radius:8px;padding:15px;margin-top:15px;display:none}
.upload-progress.active{display:block}
.upload-progress-bar{width:100%;height:12px;background:#222;border-radius:6px;overflow:hidden}
.upload-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),#ff6b35);width:0%;transition:width .3s}
.tiktok-preview{background:linear-gradient(135deg,#000,#0a0a0a);border:2px solid #dc3545;border-radius:12px;padding:20px;margin-top:15px;display:none}
.tiktok-preview.active{display:block}
footer{background:#050505;border-top:1px solid #222;padding:40px 20px;text-align:center;color:var(--gray);font-size:.8rem;margin-top:auto}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:10000;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-content{background:var(--card);border:1px solid #333;padding:40px;border-radius:12px;max-width:600px;width:90%;border-left:4px solid var(--gold)}
</style>
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div><span id="loading-text">Processando...</span></div>
<div id="custom-alert" style="position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:20000;display:none;align-items:center;justify-content:center;"><div style="background:var(--card);border:2px solid var(--gold);border-radius:12px;max-width:450px;width:90%;text-align:center;"><div style="padding:30px 20px;" id="alert-message"></div><div style="padding:20px;"><button style="background:var(--gold);color:#000;border:none;padding:12px 30px;border-radius:8px;font-weight:bold;cursor:pointer;" onclick="closeAlert()">Entendi</button></div></div></div>
<header>
<div class="logo"><img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663450024747/AtrAfygFawvBQRGl.jpg"><span class="logo-text">MAM DISTRIBUIDORA</span></div>
<p style="color:var(--gray);font-size:.75rem;">O Império da Música em Angola | Distribuição para 150+ Plataformas</p>
</header>
<nav>
<button class="nav-btn active" onclick="showSection('home',this)"><i class="fas fa-home"></i> Início</button>
<button class="nav-btn" onclick="showSection('lancar',this)"><i class="fas fa-upload"></i> Lançar</button>
<button class="nav-btn" onclick="showSection('minhas-musicas',this)"><i class="fas fa-music"></i> Minhas Músicas</button>
<button class="nav-btn" id="nav-login" onclick="openModal('modal-login')"><i class="fas fa-sign-in-alt"></i> Entrar</button>
<button class="nav-btn" id="nav-logout" style="display:none;" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
</nav>
<div class="container">
<section id="home" class="section active">
<div class="card"><h3>O IMPÉRIO DA MÚSICA EM ANGOLA</h3><p>Distribua para 150+ plataformas.</p></div>
<div id="feed-container" class="grid"></div
