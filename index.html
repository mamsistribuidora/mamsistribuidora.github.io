<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Oficial</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --gold: #D4AF37; --black: #000; --dark: #0a0a0a; --grey: #1a1a1a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--black); color: #fff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        header { background: #000; padding: 15px; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 9999; }
        .logo { color: var(--gold); font-weight: bold; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
        .ceo-label { color: #888; font-size: 10px; display: block; margin-top: 2px; }

        .layout { display: flex; flex: 1; }
        
        /* Menu Lateral Estilo Mobile Reativo */
        nav { width: 90px; background: #050505; border-right: 1px solid var(--grey); padding: 5px; position: fixed; height: 100%; z-index: 8888; }
        .nav-item { padding: 12px 2px; color: #777; cursor: pointer; display: block; font-size: 9px; margin-bottom: 8px; border-radius: 6px; border: none; background: transparent; width: 100%; text-align: center; transition: 0.3s; }
        .nav-item.active { background: #111; color: var(--gold); font-weight: bold; border-left: 3px solid var(--gold); }

        /* Área de Conteúdo Isolada */
        main { flex: 1; margin-left: 90px; padding: 15px; padding-bottom: 100px; }
        .secao { display: none; width: 100%; }
        .secao.ativa { display: block !important; }

        /* Estilo Caixas MAM */
        .box { background: #0f0f0f; border: 1px solid #222; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .btn-amarelo { background: var(--gold); color: #000; border: none; padding: 12px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; text-transform: uppercase; width: 100%; }
        
        input, textarea, select { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 13px; }
        label { font-size: 10px; color: var(--gold); font-weight: bold; display: block; margin-top: 5px; text-transform: uppercase; }

        /* Discos do Feed */
        .feed-container { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; }
        .disco-capa { min-width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--gold); text-align: center; background: #000; padding: 5px; font-weight: bold; }

        footer { text-align: center; padding: 12px; font-size: 9px; color: var(--gold); background: #000; border-top: 1px solid #111; position: fixed; bottom: 0; width: 100%; z-index: 9999; }
    </style>
</head>
<body>

<header>
    <div class="logo">MAM DISTRIBUIDORA</div>
    <span class="ceo-label">Matias Arsénio Manuel</span>
</header>
