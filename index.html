<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Painel</title>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #0a0a0a; height: 100vh; position: fixed; border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; }
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid #1a1a1a; }
        .dist-nome { color: #FFD700; font-size: 18px; font-weight: bold; }
        .user-nome { color: #888; font-size: 11px; text-transform: uppercase; display: block; }
        .nav-link { padding: 15px 20px; text-decoration: none; color: #ccc; border-bottom: 1px solid #111; font-size: 14px; cursor: pointer; }
        .nav-link:hover { color: #FFD700; background: #111; }
        .logout { margin-top: auto; color: #ff4d4d !important; border-top: 1px solid #1a1a1a; }
        
        .main-content { margin-left: 250px; padding: 20px; flex: 1; }
        .card-apoio { background: #111; border-left: 4px solid #FFD700; padding: 15px; border-radius: 12px; margin-bottom: 25px; }
        .iban { color: #FFD700; font-size: 16px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .capa { background: #1a1a1a; aspect-ratio: 1/1; border-radius: 8px; }
        
        footer { text-align: center; padding: 40px; color: #444; font-size: 11px; border-top: 1px solid #111; margin-top: 50px; }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; height: auto; position: relative; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <span class="dist-nome">MAM Distribuidora</span>
            <span class="user-nome">Matias Arsénio Manuel</span>
        </div>
        <a class="nav-link">Página Inicial</a>
        <a class="nav-link">Perfil</a>
        <a onclick="sair()" class="nav-link logout">Terminar Sessão</a>
    </nav>
    <main class="main-content">
        <h2>Página Inicial</h2>
        <div class="card-apoio">
            <div style="color:#888; font-size:11px;">APOIA ESTE PROJETO | MATIAS ARSÉNIO MANUEL</div>
            <div class="iban">IBAN BFA: 0006.0000.8631.6866.3015.2</div>
        </div>
        <div class="grid">
            <div><div class="capa"></div><p style="font-size:12px;">Single Exemplo</p></div>
        </div>
        <footer>
            &copy; 2026 MAM Distribuidora | Matias Arsénio Manuel
        </footer>
    </main>
    <script>
        function sair() {
            if(confirm("Deseja sair?")) {
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
