<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora - Oficial</title>
    <style>
        :root {
            --gold: #d4af37;
            --black: #000000;
            --dark-card: #121212;
            --input-bg: #1a1a1a;
        }

        body {
            background-color: var(--black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* PAINEL DE ACESSO - CONFORME IMAGEM */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            border: 2px solid var(--gold);
            border-radius: 30px;
            padding: 40px 25px;
            background-color: var(--black);
            text-align: center;
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-weight: bold;
            font-size: 1.4rem;
            color: var(--gold);
        }

        h1 {
            color: var(--gold);
            font-size: 1.6rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;
            background-color: var(--input-bg);
            border: 1px solid #333;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .btn-entrar {
            width: 100%;
            padding: 18px;
            background-color: var(--gold);
            color: black;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .toggle-link {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #777;
            cursor: pointer;
        }

        .toggle-link span {
            color: var(--gold);
            text-decoration: underline;
        }

        /* CONTEÚDO DO SITE (LOGADO) */
        #site-main {
            display: none;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid var(--gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 20px;
        }

        .nav-item {
            background: var(--dark-card);
            border: 1px solid #333;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            color: var(--gold);
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 0.8rem;
            color: #555;
            border-top: 1px solid #111;
        }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <div class="logo-circle">MAM</div>
            <h1 id="title-text">MAM Distribuidora</h1>
            <p class="subtitle" id="subtitle-text">INICIAR SESSÃO</p>

            <div id="form-fields">
                <input type="email" id="email" placeholder="E-mail">
                <div id="reg-fields" style="display: none;">
                    <input type="text" id="full-name" placeholder="Nome Completo">
                    <input type="text" id="art-name" placeholder="Nome Artístico">
                </div>
                <input type="password" id="pass" placeholder="Senha">
                <button class="btn-entrar" onclick="handleAuth()">Entrar</button>
            </div>

            <p class="toggle-link" id="toggle-btn" onclick="toggleForm()">
                Ainda não tem conta? <span>Criar Conta</span>
            </p>
        </div>
    </div>

    <div id="site-main">
        <header>
            <div>
                <strong style="color: var(--gold);">MAM Distribuidora</strong><br>
                <small>Matias Arsénio Manuel</small>
            </div>
            <button onclick="logout()" style="background: none; border: 1px solid red; color: red; padding: 5px; cursor: pointer;">Sair</button>
        </header>

        <div style="padding: 20px;">
            <div style="background: var(--dark-card); padding: 25px; border-radius: 20px; border: 1px solid #222;">
                <p>Saldo em Carteira</p>
                <h2 id="user-balance" style="font-size: 2.5rem; margin: 10px 0; color: var(--gold);">0 Kz</h2>
                <p>Nível: <span id="user-level" style="color: var(--gold);">Free</span></p>
            </div>
        </div>

        <div class="nav-btn-grid">
            <div class="nav-item">Minhas Músicas</div>
            <div class="nav-item">Lançar Música</div>
            <div class="nav-item">Carteira</div>
            <div class="nav-item">Estatísticas</div>
        </div>
    </div>

    <footer>
        <p>MAM Distribuidora © 2026 - Todos os direitos reservados</p>
        <p>Email: mamfilhos29@gmail.com</p>
    </footer>

    <script>
        let isLogin = true;

        function toggleForm() {
            isLogin = !isLogin;
            document.getElementById('reg-fields').style.display = isLogin ? 'none' : 'block';
            document.getElementById('subtitle-text').innerText = isLogin ? 'INICIAR SESSÃO' : 'CRIAR CONTA';
            document.getElementById('toggle-btn').innerHTML = isLogin ? 
                'Ainda não tem conta? <span>Criar Conta</span>' : 
                'Já tem uma conta? <span>Entrar</span>';
        }

        function handleAuth() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;

            // ACESSO MASTER PARA MATIAS
            if (email === "mamfilhos29@gmail.com") {
                const masterUser = {
                    name: "Matias Arsénio Manuel",
                    balance: "999.999 Kz",
                    level: "ADMIN PROMAX"
                };
                localStorage.setItem('mam_session', JSON.stringify(masterUser));
                loadSite();
                return;
            }

            if (isLogin) {
                const saved = localStorage.getItem('u_' + email);
                if (saved) {
                    localStorage.setItem('mam_session', saved);
                    loadSite();
                } else {
                    alert("Utilizador não encontrado. Por favor, crie uma conta.");
                }
            } else {
                // Registro
                const newUser = {
                    name: document.getElementById('full-name').value,
                    balance: "2.000 Kz",
                    level: "Free"
                };
                localStorage.setItem('u_' + email, JSON.stringify(newUser));
                localStorage.setItem('mam_session', JSON.stringify(newUser));
                alert("Conta criada com sucesso! Ganhou 2.000 Kz de bónus.");
                loadSite();
            }
        }

        function loadSite() {
            const session = JSON.parse(localStorage.getItem('mam_session'));
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('site-main').style.display = 'block';
            document.getElementById('user-balance').innerText = session.balance;
            document.getElementById('user-level').innerText = session.level;
        }

        function logout() {
            localStorage.removeItem('mam_session');
            location.reload();
        }

        // Verifica se já está logado
        window.onload = () => {
            if (localStorage.getItem('mam_session')) loadSite();
        }
    </script>
</body>
</html>
