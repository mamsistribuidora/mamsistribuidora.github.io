<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* CONFIGURAÇÃO RESPONSIVA DA MAM DISTRIBUIDORA */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        
        .container-mam { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .secao { margin-bottom: 30px; text-align: center; }
        
        h3 { color: #004a99; margin-bottom: 15px; font-size: 1.2rem; }

        /* Estilo dos Botões - Ajuste Automático por Dispositivo */
        .btn-mam {
            display: inline-block;
            width: 100%; /* No telemóvel ocupa tudo */
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-convidar { background-color: #007bff; color: white; margin-bottom: 10px; }
        .btn-convidar:active { transform: scale(0.98); background-color: #0056b3; }

        .btn-sair { background-color: #dc3545; color: white; margin-top: 20px; }
        .btn-sair:active { transform: scale(0.98); background-color: #a71d2a; }

        /* Seção de Apoio - Dados Bancários */
        .caixa-apoio {
            background-color: #eef4ff;
            border-left: 5px solid #004a99;
            padding: 15px;
            text-align: left;
            border-radius: 5px;
            margin-top: 10px;
        }

        .caixa-apoio p { margin: 5px 0; font-size: 15px; }

        /* AJUSTE PARA DESKTOP (Computadores) */
        @media (min-width: 768px) {
            .btn-mam { width: auto; min-width: 250px; }
            .caixa-apoio { display: inline-block; width: 80%; }
        }

        hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
    </style>
</head>
<body>
