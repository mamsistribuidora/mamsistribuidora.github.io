<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Musical</title>
    <!-- Aqui você pode colocar seus links de CSS -->
</head>
<body>
    <!-- Aqui vai o conteúdo principal do seu site -->
    <h1>Bem-vindo à Distribuidora Musical</h1>

    <!-- Formulário para o artista enviar o lançamento -->
    <form id="form-lancamento">
        <input type="text" id="titulo" placeholder="Título da música" required><br>
        <input type="text" id="artista" placeholder="Nome do artista" required><br>
        <input type="file" id="arquivo" accept=".wav, .mp3" required><br>
        <input type="file" id="capa" accept="image/*" required><br>
        <button type="submit" id="btnEnviarLancamento">Enviar Lançamento</button>
    </form>

    <div id="feed-container"></div>
    <div id="latest-release-container"></div>

    <!-- Scripts externos -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const firestore = firebase.firestore();
        const storage = firebase.storage();

        // Função para enviar lançamento
        async function enviarParaDistribuicao(data) {
            await fetch("https://mam-backend.onrender.com/release", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });
        }

        // Função que lida com o envio do formulário
        document.getElementById('form-lancamento').addEventListener('submit', async (e) => {
            e.preventDefault();

            const titulo = document.getElementById('titulo').value;
            const artista = document.getElementById('artista').value;
            const arquivo = document.getElementById('arquivo').files[0];
            const capa = document.getElementById('capa').files[0];

            // Envia para o Cloudinary ou Firebase Storage
            const fileSnapshot = await storage.ref(`musicas/${arquivo.name}`).put(arquivo);
            const capaSnapshot = await storage.ref(`capas/${capa.name}`).put(capa);

            // Recupera URLs das músicas e capa
            const fileUrl = await fileSnapshot.ref.getDownloadURL();
            const capaUrl = await capaSnapshot.ref.getDownloadURL();

            // Cria objeto para salvar no Firestore
            const data = {
                titulo,
                artista,
                fileUrl,
                capaUrl,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            // Salva no Firestore
            await firestore.collection('releases').add(data);

            // Envia os dados para o backend
            await enviarParaDistribuicao(data);

            alert('Lançamento enviado com sucesso!');
        });

        // Função para carregar os lançamentos mais recentes
        async function loadFeed() {
            const snapshot = await firestore.collection("releases")
                .orderBy("createdAt", "desc")
                .limit(20)
                .get();

            const feed = document.getElementById("feed-container");
            const latest = document.getElementById("latest-release-container");

            feed.innerHTML = "";
            latest.innerHTML = "";

            let primeiro = true;

            snapshot.forEach(doc => {
                const data = doc.data();
                const card = `
                    <div class="music-card">
                        <img src="${data.capaUrl || ''}" class="music-cover">
                        <div class="music-title">${data.titulo || 'Sem título'}</div>
                        <audio controls src="${data.fileUrl || ''}"></audio>
                    </div>
                `;
                feed.innerHTML += card;

                if (primeiro) {
                    latest.innerHTML = card;
                    primeiro = false;
                }
            });
        }

        // Carregar os lançamentos assim que a página carregar
        window.onload = loadFeed;
    </script>
</body>
</html>
