<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Login</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .auth-container { border: 2px solid #FFD700; border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; text-align: center; background: #000; }
        .logo-mam { width: 80px; height: 80px; border: 3px solid #FFD700; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 15px; font-weight: bold; color: #FFD700; font-size: 20px; }
        h1 { color: #FFD700; font-size: 1.4rem; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #111; border: 1px solid #333; border-radius: 10px; color: #fff; box-sizing: border-box; }
        .btn-gold { width: 100%; padding: 14px; background: #FFD700; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-outline { width: 100%; padding: 12px; background: transparent; border: 1px solid #FFD700; color: #FFD700; border-radius: 10px; margin-top: 15px; cursor: pointer; }
        .footer-site { margin-top: 20px; font-size: 10px; color: #444; }
    </style>
</head>
<body>
    <div class="auth-container" id="box-login">
        <div class="logo-mam">MAM</div>
        <h1>MAM DISTRIBUIDORA</h1>
        <p style="font-size: 12px; color: #888;">INICIAR SESSÃO</p>
        <form onsubmit="event.preventDefault(); window.location.href='painel.html';">
            <input type="email" placeholder="E-mail" required>
            <input type="password" placeholder="Senha" required>
            <button type="submit" class="btn-gold">ENTRAR</button>
        </form>
        <div style="margin: 15px 0; color: #444;">OU</div>
        <button class="btn-outline" onclick="toggleAuth()">CRIAR CONTA</button>
        <div class="footer-site">© 2026 MAM Distribuidora | Matias Arsénio Manuel</div>
    </div>

    <div class="auth-container" id="box-registro" style="display: none;">
        <h1>CRIAR CONTA</h1>
        <form onsubmit="registrar(event)">
            <input type="text" placeholder="Nome Completo" required>
            <input type="text" placeholder="Nome Artístico" required>
            <input type="email" placeholder="E-mail" required>
            <input type="text" placeholder="País" required>
            <input type="password" id="p1" placeholder="Senha" required>
            <input type="password" id="p2" placeholder="Confirmar Senha" required>
            <button type="submit" class="btn-gold">FINALIZAR REGISTO</button>
        </form>
        <button class="btn-outline" onclick="toggleAuth()">VOLTAR AO LOGIN</button>
    </div>

    <script>
        function toggleAuth() {
            const login = document.getElementById('box-login');
            const registro = document.getElementById('box-registro');
            login.style.display = login.style.display === 'none' ? 'block' : 'none';
            registro.style.display = registro.style.display === 'none' ? 'block' : 'none';
        }

        function registrar(e) {
            e.preventDefault();
            if(document.getElementById('p1').value !== document.getElementById('p2').value) return alert("Senhas não coincidem!");
            // Lógica de Ganhos Reais via Satélite ao criar conta
            alert("Conta Criada! Satélite pagou 2.000 KZ de bónus inicial.");
            window.location.href = 'painel.html';
        }
    </script>
</body>
</html>
