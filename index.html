<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel MAM | Matias Arsénio Manuel</title>
    <style>
        /* ESTILO ORIGINAL DARK - MAM DISTRIBUIDORA */
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* MENU ORIGINAL SOLICITADO */
        .sidebar {
            background: #0a0a0a;
            border-right: 1px solid #222;
            width: 220px;
            height: 100vh;
            position: fixed;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
        }

        .nav-link {
            color: #bbb;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 14px;
            border-bottom: 1px solid #111;
            transition: 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: #FFD700;
            background: #111;
        }

        /* CONTEÚDO PRINCIPAL */
        .main-content {
            margin-left: 220px;
            padding: 20px;
            max-width: 900px;
        }

        /* CARD IBAN (APOIO) */
        .card-iban {
            background: #111;
            border-left: 4px solid #FFD700;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .tag-ceo { color: #777; font-size: 11px; text-transform: uppercase; }
        .iban-txt { color: #FFD700; font-size: 17px; font-weight: bold; margin-top: 5px; }

        /* SEÇÃO CONVITE */
        .card-convite {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
        }
        .input-box { display: flex; gap: 10px; margin-top: 15px; }
        input#link-input {
            background: #111; border: 1px solid #333; color: #fff;
            padding: 12px; border-radius: 8px; flex: 1; font-size: 12px;
        }
        .btn-gold {
            background: #FFD700; color: #000; border: none;
            padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        /* BOTÃO SAIR */
        .btn-sair-fundo {
            width: 100%;
            background: transparent;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 12px;
            border-radius: 8px;
            margin-top: 50px;
            font-weight: bold;
            cursor: pointer;
        }

        /* RESPONSIVIDADE PARA TELEMÓVEL */
        @media (max-width: 768px) {
            .sidebar { 
                width: 100%; height: auto; position: relative; 
                flex-direction: row; flex-wrap: wrap; justify-content: center;
                border-right: none; border-bottom: 1px solid #222;
            }
            .nav-link { padding: 10px 15px; font-size: 12px; }
            .main-content { margin-left: 0; }
            .input-box { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <a href="#" class="nav-link active">Perfil</a>
    <a href="#" class="nav-link">Minhas Músicas</a>
    <a href="#" class="nav-link">Lança Música</a>
    <a href="#" class="nav-link">Carteira</a>
    <a href="#" class="nav-link">Suporte</a>
</div>

<div class="main-content">
    <h2 style="margin-top: 0;">Página Inicial</h2>

    <div class="card-iban">
        <div class="tag-ceo">CEO MAM | Matias Arsénio Manuel</div>
        <div class="iban-txt">IBAN BFA: 0006.0000.8631.6866.3015.2</div>
    </div>

    <div class="card-convite">
        <h3 style="color: #FFD700; margin: 0;">🎁 Convide um Artista</h3>
        <p style="font-size: 13px; color: #999;">Ganhe 500 KZ por indicação. Copie seu link abaixo:</p>
        <div class="input-box">
            <input type="text" id="link-input" value="https://mamsistribuidora.github.io/index.html?ref=mam_user" readonly>
            <button class="btn-gold" id="copiarBtn">COPIAR LINK</button>
        </div>
    </div>

    <button class="btn-sair-fundo" id="sairBtn">TERMINAR SESSÃO / SAIR</button>
</div>

<script>
    // Lógica para Copiar Link
    document.getElementById('copiarBtn').onclick = function() {
        const link = document.getElementById('link-input');
        link.select();
        link.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(link.value).then(() => {
            this.innerText = "COPIADO!";
            setTimeout(() => { this.innerText = "COPIAR LINK"; }, 2000);
        });
    };

    // Lógica para Sair
    document.getElementById('sairBtn').onclick = function() {
        if(confirm("Deseja mesmo sair da sua conta?")) {
            sessionStorage.clear();
            window.location.href = "login.html";
        }
    };
</script>

</body>
</html>
