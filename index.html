<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Sistema Real</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0c10; color: white; text-align: center; margin: 0; }
        header { background: #1f2833; padding: 20px; border-bottom: 3px solid #66fcf1; }
        .card { background: #1f2833; padding: 30px; border-radius: 20px; max-width: 450px; margin: 20px auto; border: 1px solid #45a29e; }
        .saldo { font-size: 45px; color: #66fcf1; font-weight: bold; margin: 15px 0; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-play { background: #66fcf1; color: #0b0c10; }
        .btn-saque { background: #25D366; color: white; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        input { width: 90%; padding: 12px; background: #000; border: 1px solid #45a29e; color: white; border-radius: 8px; margin-bottom: 10px; }
        .track { background: #161b22; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: left; }
    </style>
</head>
<body>

<header>
    <h1>MAM DISTRIBUIDORA</h1>
    <small>CONEXÃO VIA SATÉLITE ATIVA</small>
</header>

<div class="container">
    <div class="card">
        <div style="font-size: 12px; color: #45a29e;">SALDO EM MOEDAS MAM</div>
        <div class="saldo"><span id="saldo">0</span> 🪙</div>
        
        <div class="track">
            <span style="font-size: 14px; font-weight: bold;">🎧 Música 01 - Oficial</span>
            <audio style="width:100%; height:30px; margin-top:5px;" controls onended="ganharMoedas()" src="musica1.mp3"></audio>
        </div>

        <p id="msg-erro" style="color: #ff4d4d; font-size: 12px;">Mínimo para saque: 10.000 moedas</p>

        <hr style="border: 0.5px solid #333; margin: 20px 0;">
        
        <input type="text" id="nome_cliente" placeholder="Teu Nome Completo">
        <input type="text" id="iban_cliente" placeholder="Teu IBAN (Angola)">
        <button id="btnSaque" class="btn btn-saque" onclick="enviarPedidoSaque()" disabled>EFETUAR SAQUE AUTOMÁTICO</button>
        
        <div style="font-size: 10px; color: #45a29e; margin-top: 15px;">
            1 OUVINTE = +5.000 KZ NA CONTA DO ADMIN
        </div>
    </div>
</div>

<script>
    // INICIALIZAÇÃO DO EMAILJS
    (function(){
        emailjs.init("COLA_AQUI_A_TUA_PUBLIC_KEY"); // <--- BUSCA EM "ACCOUNT" NO EMAILJS
    })();

    let saldo = 0;

    function ganharMoedas() {
        saldo += 300;
        document.getElementById('saldo').innerText = saldo.toLocaleString();
        if (saldo >= 10000) {
            document.getElementById('btnSaque').disabled = false;
            document.getElementById('msg-erro').innerText = "SAQUE DISPONÍVEL!";
            document.getElementById('msg-erro').style.color = "#25D366";
        }
    }

    function enviarPedidoSaque() {
        const nome = document.getElementById('nome_cliente').value;
        const iban = document.getElementById('iban_cliente').value;

        if (!nome || !iban) { alert("Preencha todos os campos!"); return; }

        const btn = document.getElementById('btnSaque');
        btn.innerText = "A ENVIAR PARA O ADMIN...";
        btn.disabled = true;

        const dados = {
            to_name: "Matias Manuel",
            from_name: nome,
            message: `Novo pedido de saque! \nValor: ${saldo} moedas \nIBAN: ${iban}`,
            reply_to: "suporte@mam.com"
        };

        // USANDO O TEU SERVICE ID DA FOTO
        emailjs.send("service_gmwnj3w", "template_id_aqui", dados)
            .then(function() {
                alert("PEDIDO RECEBIDO! Matias recebeu o teu pedido e vai confirmar no e-mail.");
                saldo = 0;
                document.getElementById('saldo').innerText = "0";
            }, function(error) {
                alert("Erro no satélite. Tenta novamente.");
                btn.disabled = false;
                btn.innerText = "EFETUAR SAQUE AUTOMÁTICO";
            });
    }
</script>

</body>
</html>
