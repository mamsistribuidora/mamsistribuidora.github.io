<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora | Oficial</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --gold: #D4AF37; --black: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--black); color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background: #000; padding: 15px; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 9999; }
        .logo { color: var(--gold); font-weight: bold; text-transform: uppercase; font-size: 14px; }
        
        .layout { display: flex; flex: 1; }
        
        /* Menu lateral que tu aprovastes */
        nav { width: 100px; background: #050505; border-right: 1px solid #222; padding: 10px 5px; position: fixed; height: 100%; }
        .nav-item { padding: 12px 5px; color: #777; cursor: pointer; display: block; font-size: 10px; border: none; background: transparent; width: 100%; text-align: center; text-transform: uppercase; }
        .nav-item.active { color: var(--gold); font-weight: bold; border-left: 3px solid var(--gold); background: #111; }

        main { flex: 1; margin-left: 100px; padding: 20px; padding-bottom: 80px; }
        .secao { display: none; }
        .secao.ativa { display: block !important; }

        /* Boxes da tua edição de ontem */
        .box-apoio { border: 1px dashed var(--gold); padding: 20px; text-align: center; margin-bottom: 20px; }
        .box-item { background: #0f0f0f; border: 1px solid #222; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-gold { background: var(--gold); color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 10px; }
        
        .feed-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
        .disco { min-width: 85px; height: 85px; border-radius: 50%; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--gold); text-align: center; font-weight: bold; }

        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; }
        footer { text-align: center; padding: 10px; font-size: 9px; color: var(--gold); background: #000; position: fixed; bottom: 0; width: 100%; }
    </style>
</head>
<body>

<header>
    <div class="logo">MAM DISTRIBUIDORA</div>
    <div id="statusEmail" style="font-size: 9px; color: var(--gold);"></div>
</header>

<div class="layout">
    <nav>
        <button class="nav-item active" onclick="ir('home', this)">Início</button>
        <button class="nav-item" onclick="ir('perfil', this)">Perfil</button>
        <button class="nav-item" onclick="ir('lancar', this)">Lançar</button>
        <button class="nav-item" onclick="ir('musicas', this)">Músicas</button>
        <button class="nav-item" onclick="ir('carteira', this)">Carteira</button>
        <button class="nav-item" style="color:red; margin-top:20px;" onclick="sair()">Sair</button>
    </nav>

    <main>
        <div id="home" class="secao ativa">
            <div class="box-apoio">
                <h4 style="color:var(--gold)">APOIO AO CEO</h4>
                <p style="font-size: 11px;">IBAN BFA: 0006.0000.8631.6866.3015.2</p>
            </div>
            <h3>Lançamentos</h3>
            <div class="feed-container">
                <div class="disco">PLAY SEAN</div><div class="disco">MAM BEAT</div><div class="disco">NOVIDADE</div>
            </div>
            <h3>Caça Recompensa</h3>
            <div class="box-item">
                <div><b>Vídeo Pago</b><br><small>+15 Kz</small></div>
                <button class="btn-gold" onclick="ganhar(15)">ABRIR</button>
            </div>
            <div class="box-item">
                <div><b>Convidar</b><br><small>+500 Kz</small></div>
                <button class="btn-gold" onclick="convidar()">LINK</button>
            </div>
        </div>

        <div id="perfil" class="secao">
            <h3>Meu Perfil</h3>
            <div class="box-item" style="display:block">
                <input type="text" id="pNome" placeholder="Nome Artístico">
                <textarea id="pBio" placeholder="Biografia"></textarea>
                <button class="btn-gold" style="width:100%" onclick="salvarPerfil()">SALVAR NO BANCO</button>
            </div>
        </div>

        <div id="lancar" class="secao">
            <h3>Novo Lançamento</h3>
            <div class="box-item" style="display:block">
                <input type="text" id="mTitulo" placeholder="Título da Música">
                <button class="btn-gold" style="width:100%" onclick="lancarMusica()">ENVIAR MÚSICA</button>
            </div>
        </div>

        <div id="musicas" class="secao">
            <h3>Minhas Músicas</h3>
            <div id="listaMusicas"></div>
        </div>

        <div id="carteira" class="secao">
            <h3>Minha Carteira</h3>
            <div class="box-item" style="display:block; text-align:center">
                <h1 id="usrSaldo" style="color:var(--gold); font-size:36px;">0,00 Kz</h1>
                <input type="text" id="sIban" placeholder="Seu IBAN">
                <button class="btn-gold" style="width:100%" onclick="alert('Pedido enviado!')">SACAR</button>
            </div>
        </div>
    </main>
</div>

<footer>MAM DISTRIBUIDORA DIGITAL | Matias Arsénio Manuel</footer>

<script>
    // Configurações do teu Firebase
    const cfg = { apiKey: "AIzaSyBBsZS8EpszUtikaKS8B5te8C7Q9Ow-9wo", authDomain: "mam-distribuidora.firebaseapp.com", projectId: "mam-distribuidora", storageBucket: "mam-distribuidora.appspot.com", messagingSenderId: "670857002452", appId: "1:670857002452:web:404822b5376075e520ea41" };
    firebase.initializeApp(cfg);
    const auth = firebase.auth(), db = firebase.firestore();

    // Navegação que funciona
    function ir(id, btn) {
        document.querySelectorAll('.secao').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function convidar() {
        window.open("https://wa.me/?text=Vem para a MAM Distribuidora: https://mam-distribuidora.web.app");
    }

    function sair() {
        auth.signOut().then(() => location.reload());
    }

    async function ganhar(v) {
        const u = auth.currentUser;
        if(u) {
            await db.collection("users").doc(u.uid).update({ saldo: firebase.firestore.FieldValue.increment(v) });
            alert("Bónus adicionado!");
        }
    }

    async function salvarPerfil() {
        const u = auth.currentUser;
        if(u) {
            await db.collection("users").doc(u.uid).set({ 
                nome: document.getElementById('pNome').value,
                bio: document.getElementById('pBio').value 
            }, { merge: true });
            alert("Perfil salvo com sucesso!");
        }
    }

    async function lancarMusica() {
        const u = auth.currentUser;
        if(u) {
            await db.collection("musicas").add({ 
                titulo: document.getElementById('mTitulo').value, 
                userId: u.uid, status: "Pendente" 
            });
            alert("Música enviada!");
        }
    }

    auth.onAuthStateChanged(u => {
        if(u) {
            document.getElementById('statusEmail').innerText = u.email;
            db.collection("users").doc(u.uid).onSnapshot(doc => {
                if(doc.exists) document.getElementById('usrSaldo').innerText = (doc.data().saldo || 0).toLocaleString() + ",00 Kz";
            });
            db.collection("musicas").where("userId", "==", u.uid).onSnapshot(snap => {
                const div = document.getElementById('listaMusicas'); div.innerHTML = "";
                snap.forEach(d => { div.innerHTML += `<div class="box-item">${d.data().titulo} - ${d.data().status}</div>`; });
            });
        }
    });
</script>
</body>
</html>
