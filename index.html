<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM Distribuidora - Matias Arsénio Manuel</title>
    <style>
        :root {
            --mam-gold: #d4af37;
            --mam-black: #0b0b0b;
            --mam-card: #141414;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background-color: var(--mam-black); 
            color: white; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* PAINEL CENTRALIZADO (ESTILO SUA FOTO) */
        #auth-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 380px;
            border: 2px solid var(--mam-gold);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            background: var(--mam-card);
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            border: 2.5px solid var(--mam-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-weight: bold;
            font-size: 1.4rem;
            color: var(--mam-gold);
        }

        h1 { color: var(--mam-gold); font-size: 1.4rem; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { font-size: 0.8rem; color: #888; margin-bottom: 30px; text-transform: uppercase; }

        input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            color: white;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .btn-entrar {
            width: 100%;
            background: var(--mam-gold);
            color: black;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 1rem;
        }

        .toggle-text { margin-top: 20px; font-size: 0.85rem; color: #777; cursor: pointer; }
        .toggle-text span { color: var(--mam-gold); font-weight: bold; }

        /* SITE COMPLETO */
        #site-content { display: none; }
        
        nav {
            background: #000;
            padding: 20px;
            border-bottom: 1px solid var(--mam-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-info h2 { color: var(--mam-gold); font-size: 1.1rem; }
        
        .section { padding: 25px; max-width: 1100px; margin: auto; }
        .status-card { background: var(--mam-card); border-radius: 15px; padding: 25px; border: 1px solid #222; margin-bottom: 20px; }

        footer { text-align: center; padding: 30px; border-top: 1px solid #222; font-size: 0.8rem; color: #555; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <div class="logo-circle">MAM</div>
            <h1>MAM Distribuidora</h1>
            <p class="subtitle" id="auth-title">Iniciar Sessão</p>

            <div id="auth-form">
                <input type="email" id="email" placeholder="E-mail">
                <div id="reg-only" style="display: none;">
                    <input type="text" id="full-name" placeholder="Nome Completo">
                    <input type="text" id="art-name" placeholder="Nome Artístico">
                </div>
                <input type="password" id="pass" placeholder="Senha">
                <button class="btn-entrar" onclick="handleAuth()">Entrar</button>
                
                <p class="toggle-text" id="toggle-btn" onclick="toggleMode()">
                    Ainda não tem conta? <span>Criar Conta</span>
                </p>
            </div>
        </div>
    </div>

    <div id="site-content">
        <nav>
            <div class="nav-info">
                <h2>MAM Distribuidora</h2>
                <p style="font-size: 0.7rem;">C.E.O Matias Arsénio Manuel</p>
            </div>
            <button onclick="logout()" style="background: none; border: 1px solid red; color: red; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Sair</button>
        </nav>

        <div class="section">
            <div class="status-card">
                <h3 style="color: var(--mam-gold);">Bem-vindo ao Painel de Controle</h3>
                <p style="margin-top: 10px;">Status: <span id="user-status" style="color: #22c55e;">Ativo</span></p>
                <h2 id="display-balance"
